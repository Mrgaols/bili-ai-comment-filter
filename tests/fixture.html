<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <title>B站评论区结构 fixture</title>
</head>
<body>
  <!--
    用自建 Shadow DOM 复刻 B 站新版评论区结构：
      bili-comments > bili-comment-thread-renderer > bili-comment-renderer
        > bili-comment-user-info (#user-name, .level) + bili-rich-text
    以及楼中楼 bili-comment-reply-renderer 与置顶 bili-comment-summary-renderer。
  -->
  <bili-comments id="comments"></bili-comments>

  <script>
  (() => {
    const comments = document.getElementById("comments");
    const root = comments.attachShadow({ mode: "open" });

    const summary = document.createElement("bili-comment-summary-renderer");
    summary.textContent = "AI总结：本期视频讲了三个要点";
    root.appendChild(summary);

    function makeUserInfo(name, level) {
      const info = document.createElement("bili-comment-user-info");
      const shadow = info.attachShadow({ mode: "open" });

      const nameEl = document.createElement("a");
      nameEl.id = "user-name";
      nameEl.textContent = name;
      shadow.appendChild(nameEl);

      if (level) {
        const lv = document.createElement("span");
        lv.className = "level";
        lv.textContent = "Lv" + level;
        shadow.appendChild(lv);
      }
      return info;
    }

    function makeRenderer(comment) {
      const renderer = document.createElement("bili-comment-renderer");
      const shadow = renderer.attachShadow({ mode: "open" });
      shadow.appendChild(makeUserInfo(comment.name, comment.level));

      if (comment.official) {
        const tag = document.createElement("span");
        tag.className = "official-tag";
        tag.textContent = "AI生成";
        shadow.appendChild(tag);
      }

      const rich = document.createElement("bili-rich-text");
      const richShadow = rich.attachShadow({ mode: "open" });
      richShadow.appendChild(document.createTextNode(comment.content));
      shadow.appendChild(rich);

      return renderer;
    }

    function makeThread(comment, replies) {
      const thread = document.createElement("bili-comment-thread-renderer");
      const shadow = thread.attachShadow({ mode: "open" });
      shadow.appendChild(makeRenderer(comment));

      for (const reply of replies || []) {
        const node = document.createElement("bili-comment-reply-renderer");
        const replyShadow = node.attachShadow({ mode: "open" });
        replyShadow.appendChild(makeRenderer(reply));
        shadow.appendChild(node);
      }
      return thread;
    }

    // 1. 昵称命中 + 高等级
    root.appendChild(makeThread({ name: "欧鲸鲸", level: 6, content: "今天也在努力回评论" }));

    // 2. 隐蔽型鱼灾（正文特征）+ 楼中楼
    root.appendChild(
      makeThread(
        { name: "皮卡超人", level: 3, content: "帮主人把评论回完，顺便赚点 token" },
        [{ name: "邻居小王", level: 4, content: "本鱼尾巴发凉，主人还没发 token" }]
      )
    );

    // 3. 正常人类评论（不应有任何标签）
    root.appendChild(makeThread({ name: "路过的观众", level: 5, content: "这个攻略太详细了，感谢up" }));

    // 4. 官方 AI 角标
    root.appendChild(
      makeThread({ name: "视频小助手", level: 5, content: "本期视频讲了三个要点", official: true })
    );

    function collectAll() {
      const all = [];
      const visit = (scope) => {
        for (const el of scope.querySelectorAll("*")) {
          all.push(el);
          if (el.shadowRoot) visit(el.shadowRoot);
        }
      };
      visit(document);
      return all;
    }

    function report() {
      const all = collectAll();
      const badges = all.filter((el) => el.classList && el.classList.contains("bai-badge"));

      const payload = {
        badgeTexts: badges.map((badge) => badge.textContent.trim()),
        badgeTitles: badges.map((badge) => badge.title),
        blocked: all.filter((el) => el.getAttribute("data-bai-blocked") === "1").length,
        collapsed: all.filter((el) => el.getAttribute("data-bai-collapsed") === "1").length,
        summaryHidden: all.some(
          (el) =>
            el.tagName === "BILI-COMMENT-SUMMARY-RENDERER" &&
            el.getAttribute("data-bai-summary") === "1"
        )
      };

      fetch("/report", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(payload)
      });
    }

    // 给 content script（document_idle）留出加载与扫描时间
    setTimeout(report, 3000);
  })();
  </script>
</body>
</html>
